name: DAG impact analysis

on:
  pull_request:
    paths:
      - "airflow/dags/**"
      - "scripts/impact_analysis.py"
      - ".github/workflows/dag-impact.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install graphifyy==0.9.92 pyyaml

      - name: Run impact analysis
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/impact_analysis.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output-md dag-impact.md \
            --output-json dag-impact.json

      - name: Upload Graphify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphify-impact-${{ github.event.pull_request.number }}
          path: |
            airflow/dags/graphify-out/graph.json
            dag-impact.json
            dag-impact.md
          if-no-files-found: error

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dag-impact
          path: dag-impact.md
