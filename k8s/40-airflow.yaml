apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-api-server
  namespace: airflow-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: airflow-api-server}
  template:
    metadata:
      labels: {app: airflow-api-server}
    spec:
      serviceAccountName: airflow
      initContainers:
        - name: wait-db-migrated
          image: airflow-demo:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: airflow-config}
            - secretRef: {name: airflow-secrets}
          command: ["airflow", "db", "check-migrations", "--migration-wait-timeout", "600"]
      containers:
        - name: api-server
          image: airflow-demo:local
          imagePullPolicy: Never
          args: ["api-server"]
          envFrom:
            - configMapRef: {name: airflow-config}
            - secretRef: {name: airflow-secrets}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /api/v2/monitor/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-api-server
  namespace: airflow-demo
spec:
  type: NodePort
  selector: {app: airflow-api-server}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
---
