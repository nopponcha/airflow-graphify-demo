apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: airflow-demo
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U airflow; do sleep 2; done"]
      containers:
        - name: init
          image: airflow-demo:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: airflow-config}
            - secretRef: {name: airflow-secrets}
          command: ["bash", "-c"]
          args:
            - |
              set -e
              airflow db migrate
              airflow fab-db migrate || true
              airflow users create --role Admin \
                --username "$ADMIN_USERNAME" --password "$ADMIN_PASSWORD" \
                --firstname Demo --lastname Admin --email admin@example.com \
                || echo "admin user already exists"
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
