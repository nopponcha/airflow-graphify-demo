# DEMO ONLY credentials - change before any real use.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: airflow-demo
type: Opaque
stringData:
  POSTGRES_USER: airflow
  POSTGRES_PASSWORD: airflow-demo-pw
  POSTGRES_DB: airflow
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-demo-pw@postgres:5432/airflow
  AIRFLOW__API__SECRET_KEY: change-me-demo-secret-key-123456
  AIRFLOW__API_AUTH__JWT_SECRET: change-me-demo-jwt-secret-abcdef
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: airflow-demo
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  # Task workers (LocalExecutor, inside the scheduler pod) talk to the API server's Execution API
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API__BASE_URL: http://localhost:8080
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  GRAPHIFY_URL: http://graphify.airflow-demo.svc.cluster.local:8080
