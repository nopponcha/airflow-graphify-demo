apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphify
  namespace: airflow-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: graphify}
  template:
    metadata:
      labels: {app: graphify}
    spec:
      containers:
        - name: graphify
          image: graphify-airflow:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - {name: ANALYZE_ON_START, value: "false"}   # "true" = re-clone + re-analyze on start (~1-3 min)
          readinessProbe:
            httpGet: {path: /index.html, port: 8080}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: graphify
  namespace: airflow-demo
spec:
  type: NodePort
  selector: {app: graphify}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30081}]
